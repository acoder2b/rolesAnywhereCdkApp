name: GitHub actions demo for APG

on:
    push:
        branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  IAMRolesAnywhereAuthentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "16"
      - name: Install Python dependencies and CDK
        run: |
          python -m pip install --upgrade pip
          # install your Python dependencies here
          npm install -g aws-cdk
      - name: Configure AWS Credentials
        env:
          CERTIFICATE: ${{secrets.CERTIFICATE}}
          PRIVATE_KEY: ${{secrets.PRIVATE_KEY}}
        run: |
          curl -LO https://rolesanywhere.amazonaws.com/releases/1.2.1/X86_64/Linux/aws_signing_helper
          chmod +x aws_signing_helper

          printf "%s" "$CERTIFICATE" > certificate.txt
          printf "%s" "$PRIVATE_KEY" > private_key.pem

          ./aws_signing_helper credential-process --certificate certificate.txt --private-key private_key.pem --trust-anchor-arn ${{vars.TRUST_ANCHOR_ARN}} --profile-arn ${{vars.PROFILE_ARN}} --role-arn ${{vars.ROLE_ARN}} > aws_credentials.json

          export AWS_ACCESS_KEY_ID=$(jq -r '.AccessKeyId' aws_credentials.json)
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.SecretAccessKey' aws_credentials.json)
          export AWS_SESSION_TOKEN=$(jq -r '.SessionToken' aws_credentials.json)

