name: Deploy CDK App (TypeScript)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  DeployCDKApp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g aws-cdk
      
      - name: Configure AWS Credentials
        env:
          CERTIFICATE: ${{secrets.CERTIFICATE}}
          PRIVATE_KEY: ${{secrets.PRIVATE_KEY}}
        run: |
          curl -LO https://rolesanywhere.amazonaws.com/releases/1.2.1/X86_64/Linux/aws_signing_helper
          chmod +x aws_signing_helper

          printf "%s" "$CERTIFICATE" > certificate.txt
          printf "%s" "$PRIVATE_KEY" > private_key.pem

          ./aws_signing_helper credential-process --certificate certificate.txt --private-key private_key.pem --trust-anchor-arn ${{vars.TRUST_ANCHOR_ARN}} --profile-arn ${{vars.PROFILE_ARN}} --role-arn ${{vars.role_arn}} > aws_credentials.json

          export AWS_ACCESS_KEY_ID=$(jq -r '.AccessKeyId' aws_credentials.json)
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.SecretAccessKey' aws_credentials.json)
          export AWS_SESSION_TOKEN=$(jq -r '.SessionToken' aws_credentials.json)

          aws sts assume-role --role-arn ${{ inputs.role_to_assume }} --role-session-name IAMRAAssumesRole --output json > assumed_aws_credentials.json
          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' assumed_aws_credentials.json)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' assumed_aws_credentials.json)" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' assumed_aws_credentials.json)" >> $GITHUB_ENV
          echo "AWS_REGION=${{ inputs.region }}" >> $GITHUB_ENV  

      - name: Build TypeScript
        run: npm run build
      
      - name: CDK Synth
        run: cdk synth
      
      - name: CDK Deploy
        run: cdk deploy --all --require-approval never
